name: Android CI

on:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: agent.droid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Enable KVM access
        run: |
          echo "=== /dev/kvm before ==="
          ls -l /dev/kvm || echo "no /dev/kvm device node present"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "=== /dev/kvm after ==="
          ls -l /dev/kvm || echo "no /dev/kvm device node present"

      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -e
            APK=app/build/outputs/apk/debug/app-debug.apk

            adb install -r "$APK"
            adb shell am start -W -n dev.agentdroid.app/.MainActivity
            sleep 5

            # The process must still be alive, not have died on start-up.
            adb shell pidof dev.agentdroid.app > /dev/null

            # MainActivity must actually be the resumed (foreground) activity.
            adb shell dumpsys activity activities | grep -q "mResumedActivity.*dev.agentdroid.app"

            # The crash buffer must not mention us.
            if adb logcat -d -b crash | grep -q "dev.agentdroid.app"; then
              echo "::error::agent.droid crashed on launch"
              adb logcat -d -b crash
              exit 1
            fi

            echo "MainActivity launched and is in the foreground"
